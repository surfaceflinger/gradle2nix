[versions]
gradle = "9.9.1"
junit = "6.1.3"
# Intentionally using the version embedded in Gradle to reduce dependency count
# See https://docs.gradle.org/current/userguide/compatibility.html#kotlin
kotlin = { strictly = "2.4.21" }
ktor = "3.6.1"
kotest = "6.2.7"
shadow = "9.6.1"

[libraries]
clikt = "com.github.ajalt.clikt:clikt:5.2.0"
gradle-api-69 = "dev.gradleplugins:gradle-api:6.9"
gradle-api-76 = "dev.gradleplugins:gradle-api:7.6.4"
gradle-api-80 = "dev.gradleplugins:gradle-api:8.0.2"
gradle-api-81 = "dev.gradleplugins:gradle-api:8.1.1"
gradle-kotlin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
gradle-shadow = { module = "com.gradleup.shadow:shadow-gradle-plugin", version.ref = "shadow" }
gradle-toolingApi = { module = "org.gradle:gradle-tooling-api", version.ref = "gradle" }
kotest-assertions = { module = "io.kotest:kotest-assertions-core", version.ref = "kotest" }
kotest-runner = { module = "io.kotest:kotest-runner-junit5", version.ref = "kotest" }
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlinx-coroutines-core = "org.jetbrains.kotlinx:kotlinx-coroutines-core:1.11.0"
ktor-server-core = { module = "io.ktor:ktor-server-core", version.ref = "ktor" }
ktor-server-netty = { module = "io.ktor:ktor-server-netty", version.ref = "ktor" }
okio = "com.squareup.okio:okio:3.18.2"
serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.13.0"
slf4j-simple = "org.slf4j:slf4j-simple:2.0.20"

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }

[bundles]
